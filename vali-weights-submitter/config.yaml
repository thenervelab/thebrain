# Configuration for Bittensor Weight Submitter
# Subnet 75 configuration

# Bittensor Configuration
bittensor:
  subnet_id: 75
  # Single endpoint for ALL Bittensor traffic: block polling, metagraph reads and
  # weight submission. A network name ("finney", "test", "local") or a websocket
  # URL, e.g. "ws://127.0.0.1:9945" for a local subtensor node.
  chain_endpoint: "finney"

# Hippius Chain Configuration (a separate, non-Bittensor substrate chain)
hippius:
  rpc_endpoint: "ws://127.0.0.1:9944"
  ranking_storage_key: "rankingStorage.rankedList"

# Wallet Configuration
# Exactly one signing method is used, chosen by use_mnemonic:
#   use_mnemonic: true  -> derive the hotkey from the BITTENSOR_MNEMONIC env var
#   use_mnemonic: false -> load the on-disk btcli wallet named below
wallet:
  use_mnemonic: true

  # Used when use_mnemonic is false.
  name: "default"
  hotkey: "default"
  path: "~/.bittensor/wallets/"

  # Optional safety check: when use_ss58_address is true, startup fails unless the
  # signing hotkey equals ss58_address.
  use_ss58_address: false
  ss58_address: "YOUR VALI SS58 ADDRESS"

# Weight Submission Configuration
weights:
  version_key: 0
  wait_for_inclusion: true
  wait_for_finalization: false
  period: 8
  # Resubmit on transient tx-pool rejections (nonce races, "priority too low")
  # instead of losing a whole submission window.
  retries: 2
  # Block interval configuration. Must stay above the subnet's weights rate limit.
  block_interval: 101  # Submit every 101 blocks (100 block intervals)
  block_check_interval: 12  # Check block every 12 seconds
  # true: align submissions to multiples of block_interval (consistent across restarts)
  # false: submit block_interval blocks after the previous submission
  use_modulo_timing: true

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  # Weight logging options
  log_all_weights: true  # Set to false to only log summary, not individual weights
  max_weights_to_log: 0  # Maximum number of individual weights to log (0 = log all)
  
# Network Configuration
network:
  timeout: 30
  retry_attempts: 3
  retry_delay: 5
