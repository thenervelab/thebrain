name: Srtool runtime build

# Deterministic WASM build of the mainnet runtime via srtool.
# srtool is amd64-only and segfaults under QEMU on Apple Silicon, so run it
# here on an amd64 runner. The job prints the blake2_256 (set_code hash) and
# uploads the compressed WASM as an artifact.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/prune-spent-user-batches

jobs:
  srtool:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Srtool build
        id: srtool_build
        uses: chevdor/srtool-actions@v0.9.2
        with:
          chain: hippius
          package: hippius-mainnet-runtime
          runtime_dir: runtime/mainnet

      - name: Digest
        run: |
          echo '${{ steps.srtool_build.outputs.json }}' | jq . | tee srtool-digest.json
          {
            echo "## Srtool digest"
            echo ""
            echo "- **srtool/rustc:** $(jq -r '.gen, .rustc' srtool-digest.json | paste -sd' / ' -)"
            echo "- **spec_version:** 92023"
            echo "- **blake2_256 (set_code hash):** \`$(jq -r '.runtimes.compressed.blake2_256' srtool-digest.json)\`"
            echo "- **proposal hash:** \`$(jq -r '.runtimes.compressed.subwasm.proposal_hash' srtool-digest.json)\`"
            echo "- **compressed wasm:** \`$(jq -r '.runtimes.compressed.subwasm.size' srtool-digest.json)\` bytes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compressed WASM
        uses: actions/upload-artifact@v4
        with:
          name: hippius-mainnet-runtime-wasm
          path: ${{ steps.srtool_build.outputs.wasm_compressed }}
