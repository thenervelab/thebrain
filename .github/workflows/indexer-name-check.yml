name: Indexer referenced-names check (WARN-only)

# Forward-looking §13 check for hippius-indexer: does this PR's pallet source still
# have every event/call/storage item the indexer references? WARN-only — see
# .github/scripts/check-referenced-names/README.md. This is the first CI check this
# repo has had; it is deliberately never a required/blocking check.

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - "pallets/**"
      - "runtime/**"
      - ".github/scripts/check-referenced-names/**"
      - ".github/workflows/indexer-name-check.yml"
  workflow_dispatch: {}

jobs:
  check-referenced-names:
    runs-on: ubuntu-latest
    # Belt-and-braces: the tool itself always exits 0, but a future bug in it must
    # never be able to block a PR either.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Rust 1.85
        run: |
          rustup install 1.85.0
          rustup default 1.85.0

      - name: Run the referenced-names check
        run: cargo run --manifest-path .github/scripts/check-referenced-names/Cargo.toml
